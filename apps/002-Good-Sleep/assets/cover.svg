<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080b11" />
      <stop offset="50%" stop-color="#121824" />
      <stop offset="100%" stop-color="#080b11" />
    </linearGradient>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5ab" />
      <stop offset="100%" stop-color="#e5c07b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e5ab" />
      <stop offset="50%" stop-color="#e5c07b" />
      <stop offset="100%" stop-color="#a388ee" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="450" fill="url(#bg)" />
  
  <!-- 星光柔和暈染 -->
  <circle cx="620" cy="180" r="140" fill="#a388ee" opacity="0.12" filter="url(#glow)" />
  <circle cx="200" cy="300" r="160" fill="#e5c07b" opacity="0.08" filter="url(#glow)" />
  
  <!-- 月牙圖示 (右側裝飾) -->
  <g transform="translate(560, 100)">
    <circle cx="80" cy="80" r="70" fill="url(#moonGrad)" opacity="0.85" filter="url(#glow)" />
    <circle cx="110" cy="60" r="65" fill="#0c111a" />
    <!-- 小星星 -->
    <circle cx="20" cy="40" r="3" fill="#f3e5ab" opacity="0.7" />
    <circle cx="140" cy="170" r="2.5" fill="#f3e5ab" opacity="0.6" />
    <circle cx="30" cy="140" r="2" fill="#a388ee" opacity="0.5" />
  </g>
  
  <!-- 內容資訊區 -->
  <g transform="translate(80, 140)">
    <!-- 編號標籤 -->
    <rect x="0" y="-35" width="84" height="32" rx="16" fill="#e5c07b" fill-opacity="0.15" stroke="#e5c07b" stroke-width="1.5" />
    <text x="42" y="-14" fill="#f3e5ab" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" text-anchor="middle">#002</text>
    
    <!-- 主標題 -->
    <text x="0" y="45" fill="url(#textGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">Good Sleep</text>
    
    <!-- 副標題 -->
    <text x="0" y="85" fill="#8a99ad" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="500">睡前避坑引導 · 智慧鬧鐘 · 晨間復盤 · 原生 iOS</text>
    
    <!-- 標籤欄 -->
    <g transform="translate(0, 125)">
      <rect x="0" y="0" width="60" height="28" rx="6" fill="#161f30" stroke="#23304a" />
      <text x="30" y="18" fill="#edf2f7" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">iOS</text>
      
      <rect x="70" y="0" width="76" height="28" rx="6" fill="#161f30" stroke="#23304a" />
      <text x="108" y="18" fill="#edf2f7" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">SwiftUI</text>
      
      <rect x="156" y="0" width="68" height="28" rx="6" fill="#161f30" stroke="#23304a" />
      <text x="190" y="18" fill="#edf2f7" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">Swift 6</text>
      
      <rect x="234" y="0" width="68" height="28" rx="6" fill="#161f30" stroke="#23304a" />
      <text x="268" y="18" fill="#edf2f7" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">Health</text>
    </g>
  </g>
</svg>

