<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <circle cx="200" cy="150" r="160" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="650" cy="300" r="180" fill="#ec4899" opacity="0.12" filter="url(#glow)" />
  <g transform="translate(85, 205)">
    <text x="0" y="16" fill="url(#textGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="54" font-weight="800" letter-spacing="-1.2">Challenge Showcase</text>
    <text x="0" y="68" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="500">100 Apps Challenge • Central Portal &amp; Feedback Hub</text>
  </g>
</svg>

