<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <circle cx="200" cy="150" r="160" fill="#6366f1" opacity="0.15" filter="url(#glow)" />
  <circle cx="650" cy="300" r="180" fill="#ec4899" opacity="0.12" filter="url(#glow)" />
  <g transform="translate(100, 160)">
    <rect x="-10" y="-35" width="90" height="32" rx="16" fill="#6366f1" fill-opacity="0.2" stroke="#818cf8" stroke-width="1.5" />
    <text x="35" y="-14" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">#001</text>
    <text x="0" y="40" fill="url(#textGrad)" font-family="system-ui, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">Challenge Showcase</text>
    <text x="0" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18" font-weight="500">100 Apps Challenge · Central Portal &amp; Feedback Hub</text>
    <g transform="translate(0, 115)">
      <rect x="0" y="0" width="80" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="40" y="18" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">React</text>
