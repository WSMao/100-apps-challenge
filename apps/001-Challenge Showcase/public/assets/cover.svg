      <text x="120" y="18" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Vite</text>
      <rect x="160" y="0" width="95" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="207" y="18" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">TailwindCSS</text>
      <rect x="265" y="0" width="60" height="28" rx="6" fill="#1e293b" stroke="#334155" />
      <text x="295" y="18" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">pnpm</text>
    </g>
