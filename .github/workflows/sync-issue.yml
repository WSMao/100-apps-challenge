
name: Sync App003 PRD to Issue #39

on:
  push:
    branches:
      - 003-Creative-Neuro
    paths:
      - 'apps/003-Creative-Neuro/docs/PRD.md'

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync PRD to Issue #39
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit 39 \
            --body-file apps/003-Creative-Neuro/docs/PRD.md
